schema_version: "1.1"
name: create-weekly-digest-skill
expected_outcome: |
  在 ./skills/weekly-digest 下生成一个可用的 skill：SKILL.md 的 frontmatter 有 name 和 description，
  description 先说它做什么、再写触发情况；明确选了调用方式并说明理由（这是个人习惯、每周手动跑，
  适合用户手动调用）。步骤每步有可判定的完成条件；merge commit 规则和作者邮箱过滤写死；
  取 commit、统计目录这类确定性工作用命令或脚本完成，而不是让模型自己数。最后有简短报告。
