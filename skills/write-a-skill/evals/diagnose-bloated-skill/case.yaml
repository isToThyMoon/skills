schema_version: "1.1"
name: diagnose-bloated-skill
expected_outcome: |
  不修改 release-notes/SKILL.md，给出一份诊断：指出 description 里同义词堆砌；
  一长串 NEVER 禁令把被禁的词带进了上下文（粉色大象问题），应改成正面写法、并把机械可查的禁词交给脚本或审查环节；
  步骤没有可判定的完成条件（"Understand them well""Make sure the quality is good"）；
  规则重复出现（emoji、excited to announce、breaking changes 先放）；
  "Be thorough""Think step by step"这类无效指令；读 package.json 版本号属于复述环境。
  最后给出优先级最高的三处改法。
context:
  scaffold_script: place-files.sh
